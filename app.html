<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kripto Portföy Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D10;
    --bg-2: #0F1217;
    --panel: #131720;
    --panel-2: #181D27;
    --line: #1F2530;
    --line-2: #283041;
    --text: #E6E9EF;
    --text-dim: #8A93A6;
    --text-mute: #5B6377;
    --accent: #E6B144;     /* amber */
    --accent-2: #C99422;
    --gain: oklch(0.72 0.16 152);
    --loss: oklch(0.66 0.20 25);
    --info: oklch(0.74 0.12 240);
    --chip: #1A2030;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono,.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  ::selection{background:var(--accent);color:#000}

  /* App shell */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  /* Sidebar */
  .side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:20px 20px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#0B0D10;font-weight:700;font-size:14px}
  .brand-name{font-weight:600;letter-spacing:.2px;font-size:14px}
  .brand-sub{font-size:11px;color:var(--text-mute);margin-top:1px}

  .user-card{margin:14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .user-card .lbl{font-size:10.5px;letter-spacing:.12em;color:var(--text-mute);text-transform:uppercase}
  .user-card .name{font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font-size:11px;font-weight:700}
  .user-card .email{font-size:11.5px;color:var(--text-dim);margin-top:2px}
  .user-card .switch{margin-top:10px;width:100%;background:transparent;border:1px solid var(--line-2);color:var(--text-dim);padding:6px 8px;border-radius:6px;font-size:11.5px}
  .user-card .switch:hover{color:var(--text);border-color:var(--text-mute)}

  .nav{padding:6px 10px;flex:1;overflow-y:auto}
  .nav-section{font-size:10.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.12em;padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text-dim);font-size:13px;cursor:pointer;border:1px solid transparent;user-select:none}
  .nav-item:hover{background:var(--panel);color:var(--text)}
  .nav-item.active{background:var(--panel);color:var(--text);border-color:var(--line-2)}
  .nav-item .idx{width:18px;font-size:11px;color:var(--text-mute);font-family:'JetBrains Mono',monospace}
  .nav-item.active .idx{color:var(--accent)}
  .nav-item .kbd{margin-left:auto;font-size:10.5px;color:var(--text-mute);font-family:'JetBrains Mono',monospace}

  .side-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
  .side-foot button{flex:1;background:transparent;border:1px solid var(--line-2);color:var(--text-dim);padding:7px 0;border-radius:7px;font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:6px}
  .side-foot button:hover{color:var(--text);border-color:var(--text-mute)}

  /* Main */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;background:rgba(11,13,16,.75);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  .crumbs{font-size:12.5px;color:var(--text-dim)}
  .crumbs b{color:var(--text);font-weight:500}
  .topbar .grow{flex:1}
  .market-pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:7px;font-size:12px;color:var(--text-dim)}
  .market-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gain);box-shadow:0 0 0 3px rgba(120,200,140,.12)}
  .topbar .save-btn{background:var(--accent);color:#0B0D10;border:none;padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:600}
  .topbar .save-btn:hover{background:#F0BD52}
  .topbar .ghost{background:transparent;border:1px solid var(--line-2);color:var(--text-dim);padding:6px 10px;border-radius:7px;font-size:12.5px}
  .topbar .ghost:hover{color:var(--text);border-color:var(--text-mute)}

  .content{padding:24px 28px;max-width:1400px;width:100%}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:24px}
  .page-head h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
  .page-head .sub{color:var(--text-dim);font-size:13px;margin-top:4px}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
  .kpi .lbl{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.1em}
  .kpi .val{font-family:'JetBrains Mono',monospace;font-size:22px;margin-top:6px;font-weight:500;letter-spacing:-.01em}
  .kpi .delta{font-size:12px;margin-top:4px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
  .kpi .delta.up{color:var(--gain)}
  .kpi .delta.down{color:var(--loss)}
  .kpi .ico{position:absolute;right:12px;top:12px;opacity:.5}

  /* Panel */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .panel-head h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
  .panel-head .desc{color:var(--text-dim);font-size:12px;margin-left:10px}
  .panel-head .actions{margin-left:auto;display:flex;gap:8px}
  .panel-body{padding:0}

  .row-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:1100px){.row-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:7px;font-size:12.5px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-weight:500}
  .btn:hover{border-color:var(--text-mute)}
  .btn.primary{background:var(--accent);color:#0B0D10;border-color:transparent}
  .btn.primary:hover{background:#F0BD52}
  .btn.danger{background:transparent;color:var(--loss);border-color:rgba(220,90,90,.3)}
  .btn.danger:hover{background:rgba(220,90,90,.08)}
  .btn.success{background:transparent;color:var(--gain);border-color:rgba(110,190,140,.3)}
  .btn.success:hover{background:rgba(110,190,140,.08)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:11.5px}

  /* Table */
  table.t{width:100%;border-collapse:collapse}
  table.t th{text-align:left;font-size:10.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.1em;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500;background:var(--bg-2)}
  table.t td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  table.t tr:last-child td{border-bottom:none}
  table.t tr:hover td{background:rgba(255,255,255,.012)}
  table.t .sym{display:flex;align-items:center;gap:10px;font-weight:500}
  table.t .sym .ic{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--text-dim);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
  .pos{color:var(--gain)}
  .neg{color:var(--loss)}
  .muted{color:var(--text-mute)}
  .pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.04em}
  .pill.buy{background:rgba(110,190,140,.12);color:var(--gain)}
  .pill.sell{background:rgba(220,90,90,.12);color:var(--loss)}
  .pill.delist{background:rgba(255,200,100,.1);color:var(--accent);border:1px dashed rgba(230,177,68,.3)}

  /* Empty states */
  .empty{padding:48px 24px;text-align:center;color:var(--text-mute)}
  .empty .ic{font-size:28px;margin-bottom:6px;opacity:.5}
  .empty h4{margin:6px 0 4px;color:var(--text-dim);font-weight:500;font-size:13.5px}
  .empty p{margin:0;font-size:12.5px;max-width:340px;display:inline-block}

  /* Forms */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
  .field input, .field select{background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);padding:9px 11px;border-radius:7px;font-size:13px;outline:none;font-family:'JetBrains Mono',monospace}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field .hint{font-size:11px;color:var(--text-mute)}
  .field .err{font-size:11.5px;color:var(--loss)}

  /* Modal */
  .modal-back{position:fixed;inset:0;background:rgba(5,7,10,.65);display:grid;place-items:center;z-index:50;backdrop-filter:blur(4px)}
  .modal{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:min(480px,calc(100vw - 32px));max-height:80vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal-head h3{margin:0;font-size:14px;font-weight:600}
  .modal-head .x{margin-left:auto;background:transparent;border:0;color:var(--text-dim);font-size:18px;line-height:1}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  /* Trade form */
  .trade-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
  .trade-form .full{grid-column:1/-1}
  .trade-tabs{display:flex;background:var(--bg-2);padding:4px;border-radius:8px;gap:4px;border:1px solid var(--line)}
  .trade-tabs button{flex:1;border:0;background:transparent;color:var(--text-dim);padding:8px;border-radius:6px;font-size:12.5px;font-weight:600}
  .trade-tabs button.active.buy{background:rgba(110,190,140,.15);color:var(--gain)}
  .trade-tabs button.active.sell{background:rgba(220,90,90,.15);color:var(--loss)}
  .summary{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
  .summary .row{display:flex;justify-content:space-between;color:var(--text-dim)}
  .summary .row b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500}
  .summary .row.total{padding-top:6px;margin-top:2px;border-top:1px dashed var(--line-2)}
  .summary .row.total b{color:var(--accent);font-weight:600}

  /* Toast */
  .toast-host{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 12px 30px rgba(0,0,0,.5);animation:slidein .2s ease;min-width:240px;display:flex;align-items:center;gap:10px}
  .toast .dot{width:8px;height:8px;border-radius:50%}
  .toast.ok .dot{background:var(--gain)}
  .toast.err .dot{background:var(--loss)}
  .toast.info .dot{background:var(--info)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* PnL bars */
  .pnl-list{display:flex;flex-direction:column}
  .pnl-row{display:grid;grid-template-columns:60px 1fr 110px;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
  .pnl-row:last-child{border-bottom:none}
  .pnl-row .bar{height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;position:relative}
  .pnl-row .bar .fill{position:absolute;left:50%;top:0;bottom:0;background:var(--gain);border-radius:99px}
  .pnl-row .bar .fill.neg{background:var(--loss);transform-origin:right}
  .pnl-row .amt{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:500}

  /* Coin row in selector */
  .coin-list{display:flex;flex-direction:column;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg-2)}
  .coin-list .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
  .coin-list .item:hover{background:var(--panel)}
  .coin-list .item:last-child{border-bottom:0}
  .coin-list .item.active{background:var(--panel);border-left:2px solid var(--accent)}
  .coin-list .item .right{margin-left:auto;font-family:'JetBrains Mono',monospace;color:var(--text-dim)}

  /* Mini bar in market */
  .spark{width:64px;height:18px;display:inline-block;vertical-align:middle}

  /* Hidden file input */
  input[type=file].hidden{display:none}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#1F2530;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#283041}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app.jsx"></script>
</body>
</html>
